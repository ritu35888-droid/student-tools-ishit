<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Tools Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
}

.navbar {
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 15px 30px;
  font-size: 20px;
}

.container {
  padding: 40px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 30px;
}

.card {
  background: white;
  padding: 25px;
  width: 300px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
}

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
}

button {
  padding: 10px 20px;
  background: linear-gradient(to right, #ff7e5f, #feb47b);
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="navbar">
  <h2>Student Tools</h2>
</div>

<div class="container">

<div class="card">
  <h3>Percentage</h3>
  <input id="total" placeholder="Total">
  <input id="obtained" placeholder="Obtained">
  <button onclick="calc()">Calculate</button>
  <p id="res"></p>
</div>

</div>
<div class="card">
  <h3>CGPA Calculator</h3>
  <input id="cgpa" placeholder="Enter CGPA">
  <button onclick="cgpaCalc()">Convert</button>
  <p id="cgpaRes"></p>
</div>

<script>
  function cgpaCalc(){
  let c = document.getElementById("cgpa").value;
  document.getElementById("cgpaRes").innerText = (c*9.5).toFixed(2)+"%";
}
function calc(){
  let t=document.getElementById("total").value;
  let o=document.getElementById("obtained").value;
  document.getElementById("res").innerText = (o/t*100).toFixed(2)+"%";
}
</script>
</body>
</html>
