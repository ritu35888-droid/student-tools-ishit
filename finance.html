<!DOCTYPE html>
<html>
<head>
<title>Finance Tools</title>
<link rel="stylesheet" href="style.css">
<script src="scibe.css"></script>
</head>

<body>

<h2>💰 Finance Tools</h2>

<div class="container">

<div class="box">
  <h3>Simple Interest</h3>
  <input id="p" placeholder="Principal">
  <input id="r" placeholder="Rate %">
  <input id="t" placeholder="Time">
  <button onclick="interest()">Calculate</button>
  <p id="si"></p>
</div>

<div class="box">
  <h3>Discount</h3>
  <input id="price" placeholder="Price">
  <input id="disc" placeholder="Discount %">
  <button onclick="discount()">Calculate</button>
  <p id="discRes"></p>
</div>

</div>

</body>
</html>
